    <!--
      El pedido del catálogo arranca acá, mientras se descarga el resto: es el
      punto más lento de la carga. En producción va al endpoint propio
      (/api/catalog), que sirve la planilla desde el CDN de Vercel y evita que
      cada visitante descargue el CSV de Google; en `npm run dev` va directo a
      Google, porque la función no corre en el servidor de Vite. La app
      reutiliza esta misma respuesta (window.__faq3dCatalog).
    -->
    <script>
      window.__faq3dCatalog = Promise.race([
        fetch('%CATALOG_URL%')
          .then(function (response) {
            return response.ok ? response.text() : null
          })
          .catch(function () {
            return null
          }),
        new Promise(function (resolve) {
          setTimeout(function () {
            resolve(null)
          }, 8000)
        }),
      ])
    </script>
